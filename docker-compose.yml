services:
  crackledate-site:
    build: .
    container_name: crackledate-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      CLIENT_HASH_SECRET: ${CLIENT_HASH_SECRET:-}
      SUBMISSIONS_PATH: ${SUBMISSIONS_PATH:-/data/submissions.db}
    volumes:
      - submissions:/data

volumes:
  submissions:
